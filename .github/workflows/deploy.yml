name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject Production Email Configuration from GitHub Secrets
        run: |
          cat << 'EOF' > config.js
          // Production runtime configuration generated securely by GitHub Actions
          window.EMAIL_CONFIG = {
              serviceId: '${{ secrets.EMAILJS_SERVICE_ID }}',
              publicKey: '${{ secrets.EMAILJS_PUBLIC_KEY }}',
              templateAdmin: '${{ secrets.EMAILJS_TEMPLATE_ADMIN }}',
              templateClient: '${{ secrets.EMAILJS_TEMPLATE_CLIENT }}',
              formSubmitToken: '${{ secrets.FORMSUBMIT_TOKEN }}'
          };
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


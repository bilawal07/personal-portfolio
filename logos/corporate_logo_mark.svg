<svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded square base -->
  <rect width="56" height="56" rx="13" fill="#1e3a8a"/>
  <!-- Diagonal split clip -->
  <clipPath id="split">
    <rect width="56" height="56" rx="13"/>
  </clipPath>
  <g clip-path="url(#split)">
    <!-- Top-left: lighter blue -->
    <polygon points="0,0 56,0 0,56" fill="#3b82f6"/>
    <!-- Bottom-right: deep navy -->
    <polygon points="56,0 56,56 0,56" fill="#1e40af"/>
  </g>
  <!-- Subtle inner highlight ring -->
  <rect x="2" y="2" width="52" height="52" rx="11.5" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  <!-- BH monogram — large, bold, centered -->
  <text
    x="28"
    y="36"
    text-anchor="middle"
    font-family="'Segoe UI', 'Arial Black', Arial, sans-serif"
    font-size="24"
    font-weight="900"
    fill="white"
    letter-spacing="-1.5"
    style="paint-order:stroke"
    stroke="rgba(0,0,0,0.15)"
    stroke-width="1"
  >BH</text>
</svg>
